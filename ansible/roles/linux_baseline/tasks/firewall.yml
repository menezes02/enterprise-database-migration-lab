---
- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ linux_baseline_ssh_port }}"
    proto: tcp
    comment: Allow Ansible and administrative SSH access

- name: Set default incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW logging
  community.general.ufw:
    logging: low

- name: Enable UFW
  community.general.ufw:
    state: enabled
