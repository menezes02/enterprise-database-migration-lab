---
- name: Ensure SSH configuration directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SSH security configuration
  ansible.builtin.template:
    src: 00-linux-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/00-linux-baseline.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Validate complete SSH configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
